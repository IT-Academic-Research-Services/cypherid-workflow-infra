name: Plan only
run-name: Plan only in env ${{ inputs.environment || github.base_ref || github.ref_name }} branch ${{ github.base_ref || github.ref_name }} by ${{ github.actor }}

on:
  # Planning assumes an AWS OIDC role (czid-<env>-gh-actions-plan) and reads the real S3 backend.
  # The CZID-81/26 precondition (per-env OIDC trust + GitHub Environments) is now met, so an
  # automatic dev plan-on-PR runs alongside manual dispatch: a PR touching infra runs a read-only
  # dev plan routed through the all-branches `dev-plan` environment (the plan role denies the
  # `:pull_request` OIDC sub) and reports change counts before merge. The no-AWS validate.yml
  # remains the fmt/validate gate.
  pull_request:
    paths:
      - '**.tf'
      - '.terraform.lock.hcl'
      - 'lambdas/**'
      - 'glue_jobs/**'
      - 'environment*'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      environment:
        description: Both Github Environment and AWS Environment
        required: true
        type: environment
        default: dev
      targets:
        description: >-
          Optional space-separated terraform addresses to limit the plan to (-target). Leave empty
          for the full plan.
        required: false
        type: string
        default: ''

env:
  branch_name: ${{ github.base_ref || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}-${{ inputs.environment }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  should-plan:
    name: Check if Terraform Plan should be performed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.calculate-environment.outputs.environment }}
    steps:
      - name: Calculate Environment
        id: calculate-environment
        # TODO: Handle Releases
        run: |
          echo "branch_name=${{ env.branch_name }}"
          echo "environment=${{ inputs.environment }}"
          echo "| Planning | Environment | Branch |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ---------------- | ----------- | ------ |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR plan-on-review is dev-only (staging/prod stay gated); routed via dev-plan below.
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "| :green_circle: Enabled | dev (PR) | ${{ env.branch_name }} |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "${{ inputs.environment }}" ]]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "| :green_circle: Enabled | ${{ inputs.environment }} | ${{ env.branch_name }} |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ env.branch_name }}" == "development" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "| :green_circle: Enabled | dev | ${{ env.branch_name }} |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ env.branch_name }}" == "staging" ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "| :green_circle: Enabled | staging | ${{ env.branch_name }} |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ env.branch_name }}" == "main" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "| :green_circle: Enabled | prod | ${{ env.branch_name }} |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "environment=" >> "$GITHUB_OUTPUT"
            echo "| :yellow_circle: Disabled | | ${{ env.branch_name }} |" >> "$GITHUB_STEP_SUMMARY"
          fi

  plan:
    name: Execute Terraform Plan
    if: ${{ !cancelled() && needs.should-plan.outputs.environment }}
    needs:
      - should-plan
    uses: ./.github/workflows/plan_call.yml
    with:
      environment: ${{ needs.should-plan.outputs.environment }}
      # On a dev PR from a feature branch, run under the all-branches dev-plan environment (the
      # `dev` env's main-only deploy-branch policy would block the plan); on main/dispatch, empty
      # -> plan_call falls back to the env's own GitHub Environment. staging/prod unaffected.
      github_environment: ${{ (needs.should-plan.outputs.environment == 'dev' && github.ref_name != 'main') && 'dev-plan' || '' }}
      targets: ${{ inputs.targets }}
    secrets: inherit

  plan-summary:
    name: Terraform Plan Results
    #if: ${{ !cancelled() }} # && contains(needs.plan.result, 'success') }}
    runs-on: ubuntu-latest
    needs:
      - plan
    steps:
      - name: Download Results
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.plan.outputs.result-artifact-id }}
          path: results
      - name: Generate Summary
        run: |
          # Locate the result JSON regardless of whether download-artifact landed it flat
          # (results/result.json, the single-artifact-id case) or nested (results/<name>/*.json).
          # The old `results/*/*.json` glob assumed nesting and hard-failed under `bash -e` on PRs.
          mapfile -t RESULTS < <(find results -type f -name '*.json' 2>/dev/null)
          if [ "${#RESULTS[@]}" -eq 0 ]; then
            echo "No plan result JSON found under results/ (nothing to summarize)."
            exit 0
          fi
          jq --slurp . "${RESULTS[@]}"

          total=$(jq -n '{change_count: [inputs.change_count] | add}' "${RESULTS[@]}" | jq -r '"|\(if .change_count == 0 then ":green_circle:" else ":yellow_circle:" end)|\(.change_count)|"')
          changes=$(jq -r '.resource_changes[] | "|\(.action)|\(.address)|"' "${RESULTS[@]}")
          {
            echo "|   | Total Changes |"
            echo "| - | ------------- |"
            echo "$total"
            echo ""
            echo "<br/>"
            echo ""
            echo "| Action | Address |"
            echo "| ------ | ------- |"
            echo "$changes"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$total"; echo "$changes"
